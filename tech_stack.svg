<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250">
    <defs>
        <!-- Drop Shadow Filter for Cards -->
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
        </filter>

        <!-- Gradients for Cards -->
        <linearGradient id="androidGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3DDC84"/>
            <stop offset="100%" stop-color="#2196F3"/> <!-- A mix of green and blue commonly seen in modern Android Studio branding -->
        </linearGradient>

        <linearGradient id="javaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F89820"/>
            <stop offset="100%" stop-color="#5382A1"/>
        </linearGradient>

        <linearGradient id="xmlGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FF5722"/>
            <stop offset="100%" stop-color="#E64A19"/>
        </linearGradient>

        <linearGradient id="jsonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50"/>
            <stop offset="100%" stop-color="#388E3C"/>
        </linearGradient>

        <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFCA28"/>
            <stop offset="100%" stop-color="#FFA000"/>
        </linearGradient>
    </defs>

    <!-- Background (Optional, kept transparent/light for document insertion) -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Title Text -->
    <text x="500" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Technology Stack: FarmFriend Application</text>
    <line x1="300" y1="55" x2="700" y2="55" stroke="#E0E0E0" stroke-width="2"/>

    <!-- ================= BOX 1: Android Studio ================= -->
    <g transform="translate(60, 80)">
        <rect width="140" height="120" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Android Bugdroid icon simplified -->
        <path d="M 40,60 L 40,80 A 10 10 0 0 0 60,80 L 60,60 Z" fill="#3DDC84"/>
        <path d="M 80,60 L 80,80 A 10 10 0 0 0 100,80 L 100,60 Z" fill="#3DDC84"/>
        <path d="M 50,55 Q 70,25 90,55 Z" fill="#3DDC84"/>
        <circle cx="60" cy="45" r="2" fill="white"/>
        <circle cx="80" cy="45" r="2" fill="white"/>
        <line x1="55" y1="35" x2="45" y2="25" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>
        <line x1="85" y1="35" x2="95" y2="25" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>
        
        <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Android Studio</text>
        <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">Core IDE</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 210,130 L 230,130" stroke="#B0BEC5" stroke-width="4" stroke-dasharray="4,4"/>

    <!-- ================= BOX 2: Java / Kotlin ================= -->
    <g transform="translate(240, 80)">
        <rect width="140" height="120" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Java Cup simplified -->
        <path d="M 50,70 L 90,70 C 90,85 85,90 70,90 C 55,90 50,85 50,70 Z" fill="url(#javaGradient)"/>
        <path d="M 85,72 C 100,72 100,85 85,85" fill="none" stroke="url(#javaGradient)" stroke-width="4"/>
        <path d="M 60,65 Q 65,45 60,35" fill="none" stroke="#5382A1" stroke-width="3" stroke-linecap="round"/>
        <path d="M 75,65 Q 80,45 75,35" fill="none" stroke="#5382A1" stroke-width="3" stroke-linecap="round"/>
        
        <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Java / Kotlin</text>
        <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">Backend Logic</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 390,130 L 410,130" stroke="#B0BEC5" stroke-width="4" stroke-dasharray="4,4"/>

    <!-- ================= BOX 3: XML ================= -->
    <g transform="translate(420, 80)">
        <rect width="140" height="120" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- XML Brackets -->
        <text x="70" y="70" font-family="Courier New, monospace" font-size="34" font-weight="bold" fill="url(#xmlGradient)" text-anchor="middle">&lt;/&gt;</text>
        
        <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">XML UI Design</text>
        <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">Presentation</text>
    </g>

    <!-- Connector Arrow 3 -->
    <path d="M 570,130 L 590,130" stroke="#B0BEC5" stroke-width="4" stroke-dasharray="4,4"/>

    <!-- ================= BOX 4: JSON ================= -->
    <g transform="translate(600, 80)">
        <rect width="140" height="120" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- JSON Braces -->
        <text x="70" y="70" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="url(#jsonGradient)" text-anchor="middle">{ }</text>
        
        <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">JSON REST API</text>
        <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">Mandi Data Fetch</text>
    </g>

    <!-- Connector Arrow 4 -->
    <path d="M 750,130 L 770,130" stroke="#B0BEC5" stroke-width="4" stroke-dasharray="4,4"/>

    <!-- ================= BOX 5: Database (SQLite/Firebase) ================= -->
    <g transform="translate(780, 80)">
        <rect width="140" height="120" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#cardShadow)"/>
        <!-- Database Cylinder -->
        <ellipse cx="70" cy="40" rx="25" ry="8" fill="url(#dbGradient)" stroke="#E65100" stroke-width="2"/>
        <path d="M 45,40 L 45,75 A 25 8 0 0 0 95,75 L 95,40 Z" fill="url(#dbGradient)" stroke="#E65100" stroke-width="2"/>
        <ellipse cx="70" cy="60" rx="25" ry="8" fill="none" stroke="#E65100" stroke-width="2"/>
        
        <text x="70" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Database</text>
        <text x="70" y="125" font-family="Arial, sans-serif" font-size="11" fill="#777" text-anchor="middle">SQLite / Firebase</text>
    </g>

</svg>