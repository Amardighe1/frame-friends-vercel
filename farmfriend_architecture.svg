<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <defs>
        <!-- Gradients -->
        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4CAF50" />
            <stop offset="100%" stop-color="#2E7D32" />
        </linearGradient>
        <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f5f5f5" />
        </linearGradient>
        
        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
        </filter>

        <!-- Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#F9FAFB" />

    <!-- Title -->
    <text x="400" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">FarmFriend Application Architecture Flowchart</text>

    <!-- UI/Frontend Section -->
    <rect x="50" y="100" width="700" height="150" rx="10" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2" stroke-dasharray="5,5" />
    <text x="70" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1565C0">1. Presentation Layer (UI/UX - XML)</text>

    <!-- Main Module (App Core) -->
    <rect x="300" y="150" width="200" height="70" rx="8" fill="url(#mainGradient)" filter="url(#shadow)" />
    <text x="400" y="185" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">MainActivity</text>
    <text x="400" y="205" font-family="Arial, sans-serif" font-size="12" fill="#E8F5E9" text-anchor="middle">(Application Dashboard)</text>

    <!-- Connecting Arrows from Main to Sub Modules -->
    <!-- To Camera/AI -->
    <path d="M 300 185 L 180 185 L 180 300" fill="none" stroke="#555" stroke-width="3" marker-end="url(#arrow)" />
    <!-- To DB/Vet -->
    <path d="M 400 220 L 400 300" fill="none" stroke="#555" stroke-width="3" marker-end="url(#arrow)" />
    <!-- To API/Mandi -->
    <path d="M 500 185 L 620 185 L 620 300" fill="none" stroke="#555" stroke-width="3" marker-end="url(#arrow)" />

    <!-- Application Components Section -->
    <rect x="50" y="270" width="700" height="280" rx="10" fill="#FFF3E0" stroke="#FFCC80" stroke-width="2" stroke-dasharray="5,5" />
    <text x="70" y="295" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#EF6C00">2. Business Logic &amp; Data Layer (Java/Kotlin)</text>

    <!-- Box 1: AI / Camera -->
    <rect x="90" y="320" width="180" height="100" rx="8" fill="url(#boxGradient)" stroke="#B0BEC5" stroke-width="2" filter="url(#shadow)" />
    <circle cx="180" cy="340" r="15" fill="#4CAF50" />
    <text x="180" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📷</text>
    <text x="180" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">AI Disease Detector</text>
    <text x="180" y="390" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Implicit Intent:</text>
    <text x="180" y="405" font-family="Arial, sans-serif" font-size="11" fill="#1976D2" text-anchor="middle">ACTION_IMAGE_CAPTURE</text>

    <!-- Box 2: Vet Database -->
    <rect x="310" y="320" width="180" height="100" rx="8" fill="url(#boxGradient)" stroke="#B0BEC5" stroke-width="2" filter="url(#shadow)" />
    <circle cx="400" cy="340" r="15" fill="#FF9800" />
    <text x="400" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">🏥</text>
    <text x="400" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Vet Locator DB</text>
    <text x="400" y="390" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">SQLite / Firebase</text>
    <text x="400" y="405" font-family="Arial, sans-serif" font-size="11" fill="#1976D2" text-anchor="middle">Query Contacts (Location)</text>

    <!-- Box 3: Mandi API -->
    <rect x="530" y="320" width="180" height="100" rx="8" fill="url(#boxGradient)" stroke="#B0BEC5" stroke-width="2" filter="url(#shadow)" />
    <circle cx="620" cy="340" r="15" fill="#2196F3" />
    <text x="620" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📈</text>
    <text x="620" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Live Mandi Prices</text>
    <text x="620" y="390" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Async Background Thread</text>
    <text x="620" y="405" font-family="Arial, sans-serif" font-size="11" fill="#1976D2" text-anchor="middle">Fetch Context API (JSON)</text>

    <!-- Bottom Connectors -->
    <!-- Camera to Model -->
    <path d="M 180 420 L 180 460" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <rect x="130" y="465" width="100" height="40" rx="4" fill="#CFD8DC" />
    <text x="180" y="485" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">TFLite AI Model</text>

    <!-- SQLite to List -->
    <path d="M 400 420 L 400 460" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <rect x="350" y="465" width="100" height="40" rx="4" fill="#CFD8DC" />
    <text x="400" y="485" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">ACTION_DIAL</text>

    <!-- API to RecyclerView -->
    <path d="M 620 420 L 620 460" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" />
    <rect x="570" y="465" width="100" height="40" rx="4" fill="#CFD8DC" />
    <text x="620" y="485" font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">RecyclerView</text>

</svg>